services:
  - type: web
    name: jishnu-infotech-support
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: support-attachments
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ATTACHMENTS_PATH
        value: /var/data/attachments
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_AGENT_EMAIL
        sync: false
      - key: SEED_AGENT_PASSWORD
        sync: false
      - key: SEED_AGENT_NAME
        sync: false
      - key: SEED_CUSTOMER_EMAIL
        sync: false
      - key: SEED_CUSTOMER_PASSWORD
        sync: false
      - key: SEED_CUSTOMER_NAME
        sync: false
      - key: SEED_CUSTOMER_COMPANY
        sync: false
