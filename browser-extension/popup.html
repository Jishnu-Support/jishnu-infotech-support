<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jishnu Infotech Support</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">J</div>
        <div><strong>Jishnu Infotech</strong><span>Support portal</span></div>
      </header>
      <button id="open-portal" class="secondary" type="button">Open support portal</button>
      <button id="create-ticket" class="primary" type="button">Create ticket from this page</button>
      <p class="hint">The current page link and any selected text will be added to the draft. Review it and sign in before submitting.</p>
      <details>
        <summary>Portal address</summary>
        <label for="portal-url">Support portal URL</label>
        <input id="portal-url" type="url" spellcheck="false" autocomplete="url">
        <button id="save-url" class="secondary save" type="button">Save address</button>
      </details>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
